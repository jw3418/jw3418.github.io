---
layout: default
---
<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      <span class="reading-time-label">&nbsp;&middot;&nbsp;읽는 데 약 <span id="reading-time">?</span>분</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">&larr; 목록으로</a>
  </footer>
</article>
